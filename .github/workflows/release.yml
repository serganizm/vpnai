name: Publish VPNAI standalone release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
        default: 'v0.8.0'
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  register:
    name: Record build run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NATIVE_RESULT: pending
      RELEASE_RESULT: pending
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Record run identifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_receipt.py

  native:
    name: Build and test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            arch: x64
          - os: ubuntu-22.04
            target: linux-x64
            arch: x64
          - os: macos-15
            target: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set up build Python (CI only)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies (CI only)
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt pyinstaller==6.22.3
      - name: Install OpenVPN parser for integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends openvpn
      - name: Run regression tests on this OS
        run: python -m unittest discover -s app/tests -v
      - name: Validate distribution manifest
        run: python .github/scripts/build_release.py --version "$RELEASE_TAG"
      - name: Build single executable with bundled SSH
        run: python .github/scripts/build_binary.py --version "$RELEASE_TAG" --target '${{ matrix.target }}'
      - name: Offline standalone runtime and UI smoke test
        run: python .github/scripts/smoke_binary.py --version "$RELEASE_TAG" --target '${{ matrix.target }}'
      - name: Upload tested standalone package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tested standalone files
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build optional source archive
        run: python3 .github/scripts/build_release.py --version "$RELEASE_TAG"
      - name: Download tested standalone packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: native-*
          merge-multiple: true
          path: build/packages
      - name: Verify all four targets and build combined archive
        run: python3 .github/scripts/collect_release.py
      - name: Publish release only after every target passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "VPNAI $RELEASE_TAG" \
            --notes-file build/release-notes.md build/release/*
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Save verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  receipt:
    name: Record release verification
    if: always()
    needs: [register, native, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NATIVE_RESULT: ${{ needs.native.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Check out receipt writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Save publication result and asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_receipt.py

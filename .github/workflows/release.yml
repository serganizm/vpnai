name: Publish VPNAI release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run application tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s app/tests -v
      - name: Build and verify portable archive
        run: python3 .github/scripts/build_release.py
      - name: Create draft with assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "VPNAI $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md \
            build/VPNAI.zip build/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false

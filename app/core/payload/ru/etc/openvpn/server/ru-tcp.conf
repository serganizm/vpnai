local @@RU_IP@@
disable-dco
port @@OVPN_PORT@@
proto tcp4-server
dev tun-ovpn-tcp
dev-type tun
topology subnet
server @@TCP_SERVER@@
ca /etc/openvpn/server/pki/ca.crt
cert /etc/openvpn/server/pki/issued/ru-server.crt
key /etc/openvpn/server/pki/private/ru-server.key
dh none
ecdh-curve prime256v1
crl-verify /etc/openvpn/server/pki/crl.pem
tls-crypt /etc/openvpn/server/tls-crypt.key
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
verify-client-cert require
remote-cert-tls client
duplicate-cn
script-security 2
auth-user-pass-verify /etc/openvpn/server/auth.py via-file
management /run/openvpn-server/ru-tcp-management.sock unix
keepalive 10 60
persist-key
persist-tun
tun-mtu 1360
mssfix 1320
status /run/openvpn-server/ru-tcp-status.log 10
status-version 3
verb 3
# Exact IPv4 CIDR routes are pushed on connection.
client-connect "/usr/local/libexec/ovpn-session-limit connect"
client-disconnect "/usr/local/libexec/ovpn-session-limit disconnect"
